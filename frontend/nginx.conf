# Serves the React build and forwards API calls to the Go backend,
# so the browser always talks to a single origin (no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: /api/health, /api/operations/{op}
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Swagger UI and the OpenAPI spec served by the backend
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
